[project]
name = "modelvault"
version = "0.1.0"
description = "Security incident-response platform for ML model access monitoring"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faker>=40.37.0",
    "modelvault-backend",
]

[dependency-groups]
dev = [
    "modelvault-backend[dev]",
]

[tool.uv.sources]
modelvault-backend = { workspace = true }

[tool.uv.workspace]
members = ["modelvault-backend"]
