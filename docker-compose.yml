version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: modelvault-db
    restart: always
    environment:
      POSTGRES_USER: modelvault
      POSTGRES_PASSWORD: modelvault_secret
      POSTGRES_DB: modelvault_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelvault -d modelvault_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./modelvault-backend
      dockerfile: Dockerfile
    container_name: modelvault-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=ModelVault
      - API_V1_STR=/api/v1
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=modelvault
      - POSTGRES_PASSWORD=modelvault_secret
      - POSTGRES_DB=modelvault_db
      - POSTGRES_ASYNC_URI=postgresql+asyncpg://modelvault:modelvault_secret@db:5432/modelvault_db
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
