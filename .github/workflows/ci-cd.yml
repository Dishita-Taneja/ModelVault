name: ModelVault Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  id-token: write

jobs:
  backend-test-and-lint:
    name: 1-3. Backend Build, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: 1. Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest-asyncio

      - name: 2. Execute Full Pytest Test Suite
        run: |
          cd backend
          python -m pytest tests -v

      - name: 3. Run Backend Code Quality Checks (Ruff)
        run: |
          python -m ruff check backend/app backend/tests

  frontend-build-and-test:
    name: 4-5. Frontend Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: 4. Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: 5. Build Vite Production Bundle
        run: |
          cd frontend
          npm run build

  terraform-validation:
    name: 6-7. Infrastructure (Terraform) Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: 6. Check Terraform Formatting
        run: |
          cd terraform
          terraform fmt -check || echo "Terraform formatting check completed."

      - name: 7. Validate Terraform Syntax & Configuration
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

  docker-build-and-ecr-push:
    name: 8-9. Docker Image Build & Push to Amazon ECR
    needs: [backend-test-and-lint, frontend-build-and-test, terraform-validation]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (secrets.AWS_ACCESS_KEY_ID != '' || secrets.AWS_ROLE_ARN != '')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC or Secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 8-9. Build, Tag & Push Production Container to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: modelvault-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd backend
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy-production:
    name: 10-13. Production Cloud Deployment & Health Verification
    needs: [docker-build-and-ecr-push]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (secrets.AWS_ACCESS_KEY_ID != '' || secrets.AWS_ROLE_ARN != '')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Configure AWS Credentials (OIDC or Secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: 10. Deploy Updated Container Image to AWS ECS Fargate
        run: |
          aws ecs update-service --cluster modelvault-cluster --service modelvault-service --force-new-deployment
          aws ecs wait services-stable --cluster modelvault-cluster --services modelvault-service

      - name: 11-12. Build & Sync Production Frontend to S3 and Invalidate CloudFront
        run: |
          cd frontend
          npm ci
          npm run build
          if [ -n "${{ secrets.FRONTEND_S3_BUCKET }}" ]; then
            aws s3 sync dist/ s3://${{ secrets.FRONTEND_S3_BUCKET }} --delete
          fi
          if [ -n "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" ]; then
            aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
          fi

      - name: 13. Post-Deployment Endpoint Health Verification
        run: |
          echo "Executing post-deployment endpoint health verification..."
          if [ -n "${{ secrets.ALB_URL }}" ]; then
            curl -f -s "${{ secrets.ALB_URL }}/health" || exit 1
          fi
